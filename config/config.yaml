# --- CAN channel sharing ---
# Each physical CAN channel (CAN_PORT value below) has a hard FPGA-bitfile limit
# of 3 motor ID slots. If two (or more) *_Module entries below are given the
# *same* CAN_PORT string, the driver automatically time-shares that channel's
# 3 slots between them, one module per CANLoop_period_us tick (round-robin).
# This is fully config-driven - no code changes are needed to merge/un-merge a
# port; see fpga_driver's LegModule/CANChannel port-grouping logic.
#
# Requirements when sharing a port:
#   1. CAN_ID values must be globally unique across every module sharing that
#      port (e.g. one leg uses 1,2,3 and the other uses 4,5,6 - not 1,2,3 on
#      both). Reassign the losing leg's motor Node IDs via a CAN config frame
#      BEFORE physically rewiring it onto the surviving leg's bus - if both
#      legs still answer to 1/2/3 while physically on the same wire, they will
#      collide the moment they're merged.
#   2. Physically move the merged leg's 120 ohm bus termination resistor to the
#      new true end of the daisy chain; the old termination point becomes a
#      mid-bus node once merged.
#   3. Each motor's effective CAN update rate becomes
#      CANLoop_period_us / (number of modules sharing the port) - e.g. 2 legs
#      sharing one port at the default 1000 us tick -> 2000 us (500 Hz) per leg.
#      Legs that do NOT share a port are unaffected and keep the full tick rate.
#
# Interrupt Setup, Triggered By FPGA IRQ
# IRQ 0
# Loop Period (type int) of the main loop, where controllers were implemented
MainLoop_period_us: 1000
# IRQ 1
# Loop Period (type int) of the loop handling CAN transceiving, at least 1000 us
CANLoop_period_us: 1000
# CAN Bus timeout
CAN_Timeout_us: 1000

# Measure hall calibration offset
# Set to 1 when measuring the offset value of each module
Measure_offset: 0
Hall_calibration_vel: 0.5
Hall_calibration_tol: 0.005

# MOD A Bias represented in radian
LF_Module:
  Enable: 1
  CAN_PORT: "MOD1CAN0"
  Motor_R:
    FW_Version: 3
    CAN_ID: 1
    Calibration_Bias: 0.021583
    KP: 85
    KI: 0
    KD: 1.75
    KT: 2.04
    Torque_Feedfoward: 0
  Motor_L:
    FW_Version: 3
    CAN_ID: 2
    Calibration_Bias: -0.85281
    KP: 85
    KI: 0
    KD: 1.75
    KT: 2.148
    Torque_Feedfoward: 0 
  Motor_H:
